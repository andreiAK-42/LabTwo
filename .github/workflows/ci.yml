name: CI (Build & Test)

on:
  pull_request:
    branches: [ "master", "main" ]
  push:
    branches: [ "master", "main" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Dependencies
        run: |
          chmod +x setup-libs.sh
          ./setup-libs.sh

      - name: Fix script permissions
        run: chmod +x scripts/*.sh

      - name: Build Project
        run: ./scripts/build.sh

      - name: Run Unit Tests
        continue-on-error: true
        run: ./scripts/unit-test.sh

      - name: Run Integration Tests
        continue-on-error: true
        run: ./scripts/test.sh

      # Добавь в args ORG_KEY и PROJECT_KEY. Сонар ты создавал, по идее у тебя где-то должны быть
      # Или снеси всю часть с сонаром к черту (но это в требованиях лабы есть)
      # Или оставь как есть, он по идее скипнется если не дать ему токен.
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=SONAR_ORG_KEY
            -Dsonar.projectKey=SONAR_PROJECT_KEY
            -Dsonar.sources=src
            -Dsonar.java.binaries=build/libs
            -Dsonar.java.libraries=lib/*.jar

      - name: Telegram Notification
        if: always() && secrets.TELEGRAM_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            CI Pipeline finished!
            Status: ${{ job.status }}
            Repo: ${{ github.repository }}